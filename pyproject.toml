[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-belief-revision-engine"
version = "0.1.0"
description = "AGM-inspired belief revision engine computing minimal-cost contractions when integrating conflicting facts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-belief-revision-engine = "agent_belief_revision_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_belief_revision_engine*"]
